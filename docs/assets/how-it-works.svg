<?xml version="1.0" encoding="UTF-8"?>
<!--
  Conceptual chart: nodes and arrows, not a procedure listing.
  Flat grayscale, 1px lines, no gradients or shadows.
  Light colors are the default. docs/assets/how-it-works.png
  and how-it-works-dark.png are rasterized from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="howTitle howDesc">
  <title id="howTitle">How residue works</title>
  <desc id="howDesc">A repository's linked worktrees are checked and reported. scan and explain only read that report and stop; they do not lead to deletion. remove is a separate command, which you run or which watch chooses paths for. Fresh checks then leave the worktree in place on a block, an unknown, or a change. When every check passes, git worktree remove deletes it without --force, or it goes to the trash for restore. Passing is not a safety guarantee, and age alone does not mean inactive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" class="head"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .frame, .box, .line { stroke: #141414; }
    .box { fill: #ffffff; }
    .ink { fill: #141414; }
    .muted { fill: #3a3a3a; }
    .head { fill: #141414; }
    text { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg, .box { fill: #0d1117; }
      .frame, .box, .line { stroke: #f4f4f4; }
      .ink, .head { fill: #f4f4f4; }
      .muted { fill: #d2d2d2; }
    }
  </style>
  <rect class="bg" width="420" height="420"/>
  <rect class="frame" x="0.5" y="0.5" width="419" height="419" fill="none" stroke-width="1"/>

  <!-- repository -> linked worktrees -> report -->
  <rect class="box" x="126" y="16" width="168" height="32" stroke-width="1"/>
  <text class="ink" x="210" y="37" text-anchor="middle" font-size="13">repository</text>

  <line class="line" x1="210" y1="48" x2="210" y2="70" stroke-width="1.25" marker-end="url(#arrow)"/>

  <rect class="box" x="102" y="72" width="216" height="32" stroke-width="1"/>
  <text class="ink" x="210" y="93" text-anchor="middle" font-size="13">linked worktrees</text>

  <line class="line" x1="210" y1="104" x2="210" y2="126" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text class="muted" x="218" y="120" font-size="11">checks</text>

  <rect class="box" x="150" y="128" width="120" height="32" stroke-width="1"/>
  <text class="ink" x="210" y="149" text-anchor="middle" font-size="13">report</text>

  <!-- read path ends; removal is a separate command -->
  <polyline class="line" points="210,160 210,180 104,180 104,198" fill="none" stroke-width="1.25" marker-end="url(#arrow)"/>
  <polyline class="line" points="210,180 318,180 318,198" fill="none" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text class="muted" x="28" y="174" font-size="11">read only</text>
  <text class="muted" x="232" y="174" font-size="11">you or watch</text>

  <rect class="box" x="16" y="200" width="176" height="48" stroke-width="1"/>
  <text class="ink" x="104" y="220" text-anchor="middle" font-size="13">scan / explain</text>
  <text class="muted" x="104" y="238" text-anchor="middle" font-size="11">reads. stops.</text>

  <rect class="box" x="232" y="200" width="172" height="32" stroke-width="1"/>
  <text class="ink" x="318" y="221" text-anchor="middle" font-size="13">remove</text>

  <line class="line" x1="318" y1="232" x2="318" y2="266" stroke-width="1.25" marker-end="url(#arrow)"/>

  <rect class="box" x="232" y="268" width="172" height="32" stroke-width="1"/>
  <text class="ink" x="318" y="289" text-anchor="middle" font-size="13">fresh checks</text>

  <!-- stay, or Git delete, or trash -->
  <polyline class="line" points="318,300 318,322 90,322 90,344" fill="none" stroke-width="1.25" marker-end="url(#arrow)"/>
  <polyline class="line" points="318,322 234,322 234,344" fill="none" stroke-width="1.25" marker-end="url(#arrow)"/>
  <polyline class="line" points="318,322 363,322 363,344" fill="none" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text class="muted" x="16" y="314" font-size="11">block, unknown, or changed</text>
  <text class="muted" x="268" y="314" font-size="11">all pass</text>

  <rect class="box" x="16" y="346" width="148" height="44" stroke-width="1"/>
  <text class="ink" x="90" y="373" text-anchor="middle" font-size="13">stays</text>

  <rect class="box" x="176" y="346" width="116" height="44" stroke-width="1"/>
  <text class="ink" x="234" y="364" text-anchor="middle" font-size="13">git remove</text>
  <text class="muted" x="234" y="380" text-anchor="middle" font-size="11">no --force</text>
  <text class="muted" x="307" y="373" text-anchor="middle" font-size="11">or</text>

  <rect class="box" x="316" y="346" width="88" height="44" stroke-width="1"/>
  <text class="ink" x="360" y="364" text-anchor="middle" font-size="13">trash</text>
  <text class="muted" x="360" y="380" text-anchor="middle" font-size="11">restore</text>
</svg>

  <title id="logoTitle">Residue</title>
  <desc id="logoDesc">Three flat sheets stacked like linked worktrees, with a small square set apart underneath.</desc>
  <g stroke="#141414" stroke-width="4.25" stroke-linejoin="round" stroke-linecap="round" fill-rule="evenodd">
    <polygon fill="#b0b0b0" points="164,160 200,124 200,144 164,180"/>
    <polygon fill="#d4d4d4" points="164,140 200,104 200,124 164,160"/>
    <polygon fill="#ececec" points="164,120 200,84 200,104 164,140"/>
    <polygon fill="#c8c8c8" points="32,148 164,160 164,180 32,168"/>
    <polygon fill="#e4e4e4" points="32,128 164,140 164,160 32,148"/>
    <polygon fill="#f5f5f5" points="32,108 164,120 164,140 32,128"/>
    <polygon fill="#ffffff" points="32,108 164,120 200,84 68,72"/>
    <g fill="none">
      <path d="M68 72 L200 84 L200 144 L164 180 L32 168 L32 108 L68 72 Z"/>
      <path d="M32 108 L164 120 L200 84"/>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Residue mark. Same stack and separate square as the generated logo.
  No background slab, no gradients, no shadows.
  This file is the light-theme drawing. logo-dark.svg is the same
  geometry with light strokes for a dark page.
-->

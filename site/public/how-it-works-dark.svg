<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept chart. Transparent background, no outer frame, no gradients.
  The block path leaves the left of "fresh checks" and ends at "stays".
  The all-pass path is two arrows from the bottom of that node to
  git remove and trash. Those arrows do not meet the block path.
  README PNGs are rasterized with JetBrains Mono.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" role="img" aria-labelledby="howTitle howDesc">
  <title id="howTitle">How residue works</title>
  <desc id="howDesc">A repository's linked worktrees are checked and reported. scan and explain only read that report and stop. remove is a separate command, which you run or which watch chooses paths for. From fresh checks, the left arrow ends at stays when a check blocks, is unknown, or the worktree changed. A different pair of arrows, taken only when every check passes, goes to git worktree remove without --force or to the trash for restore. The block path does not continue to deletion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f4f4f4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", "Cascadia Mono", "Liberation Mono", monospace; }
  </style>
  <g fill="none" stroke="#f4f4f4" stroke-width="1.25">
    <rect x="148" y="16" width="204" height="42"/>
    <line x1="250" y1="58" x2="250" y2="84" marker-end="url(#arrow)"/>
    <rect x="96" y="86" width="308" height="42"/>
    <line x1="250" y1="128" x2="250" y2="158" marker-end="url(#arrow)"/>
    <rect x="170" y="160" width="160" height="42"/>
    <polyline points="250,202 250,228 118,228 118,252" marker-end="url(#arrow)"/>
    <polyline points="250,228 382,228 382,252" marker-end="url(#arrow)"/>
    <rect x="20" y="254" width="196" height="58"/>
    <rect x="284" y="262" width="196" height="42"/>
    <line x1="382" y1="304" x2="382" y2="340" marker-end="url(#arrow)"/>
    <rect x="250" y="342" width="230" height="44"/>
    <!-- block path ends at stays; it does not reach git remove or trash -->
    <polyline points="250,386 250,424 102,424 102,468" marker-end="url(#arrow)"/>
    <line x1="310" y1="386" x2="310" y2="468" marker-end="url(#arrow)"/>
    <line x1="430" y1="386" x2="430" y2="468" marker-end="url(#arrow)"/>
    <rect x="16" y="470" width="172" height="100"/>
    <rect x="240" y="470" width="140" height="72"/>
    <rect x="404" y="470" width="80" height="72"/>
  </g>
  <g fill="#f4f4f4" font-size="16">
    <text x="250" y="43" text-anchor="middle">repository</text>
    <text x="250" y="113" text-anchor="middle">linked worktrees</text>
    <text x="250" y="187" text-anchor="middle">report</text>
    <text x="118" y="278" text-anchor="middle">scan / explain</text>
    <text x="382" y="289" text-anchor="middle">remove</text>
    <text x="365" y="370" text-anchor="middle">fresh checks</text>
    <text x="102" y="508" text-anchor="middle">stays</text>
    <text x="310" y="500" text-anchor="middle">git remove</text>
    <text x="444" y="500" text-anchor="middle">trash</text>
  </g>
  <g fill="#e6e6e6" font-size="14">
    <text x="258" y="150">checks</text>
    <text x="24" y="222">read only</text>
    <text x="292" y="222">you or watch</text>
    <text x="118" y="300" text-anchor="middle">reads. stops.</text>
    <text x="102" y="532" text-anchor="middle">block, unknown,</text>
    <text x="102" y="552" text-anchor="middle">or changed</text>
    <text x="370" y="418" text-anchor="middle">all pass</text>
    <text x="370" y="440" text-anchor="middle">or</text>
    <text x="310" y="522" text-anchor="middle">no --force</text>
    <text x="444" y="522" text-anchor="middle">restore</text>
  </g>
</svg>

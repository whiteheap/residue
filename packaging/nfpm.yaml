# nfpm config for the Linux packages. packaging/linux-packages.sh runs nfpm
# from inside an extracted release archive, so `src` paths are relative to it,
# and sets VERSION (without the v) and ARCH (amd64 or arm64).
name: residue
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Trevor I. Lasn <trevorlasn@gmail.com>
vendor: Whiteheap
homepage: https://github.com/whiteheap/residue
license: MIT
description: |-
  Find the Git worktrees coding agents leave behind, and remove one only when
  nothing in it would be lost.

contents:
  - src: ./residue
    dst: /usr/bin/residue
    file_info:
      mode: 0755
  - src: ./README.md
    dst: /usr/share/doc/residue/README.md
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/residue/CHANGELOG.md
  - src: ./LICENSE
    dst: /usr/share/doc/residue/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/residue/LICENSE
    packager: rpm
  - src: ./LICENSE
    dst: /usr/share/licenses/residue/LICENSE
    packager: archlinux

# residue needs git 2.36 or later. Debian versions carry a 1: epoch, and on
# Fedora the git binary is in git-core.
overrides:
  deb:
    depends:
      - git (>= 1:2.36)
  rpm:
    depends:
      - git-core >= 2.36
  archlinux:
    depends:
      - git>=2.36

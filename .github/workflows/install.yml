name: install

# Runs site/public/install.sh for real, through every channel it can pick:
# Homebrew (macOS), apt (Ubuntu, with passwordless sudo), dnf (Fedora) and
# pacman (Arch) in containers, and the release archive on macOS, Ubuntu,
# Alpine (busybox sh) and FreeBSD. Each job runs --dry-run first, then the
# real install, then the installed `residue --version`, then the script again,
# which must be an upgrade or a no-op. It installs the latest release, so it
# also checks that release's packages, repositories and checksums. On FreeBSD,
# --version of a release with no FreeBSD archive must stop with a plain error.
# The refusals and windows jobs check the machines it must turn away.
on:
  pull_request:
    paths:
      - "site/public/install.sh"
      - ".github/pacman-siglevel-check.sh"
      - ".github/workflows/install.yml"
  push:
    branches: [main]
    paths:
      - "site/public/install.sh"
      - ".github/pacman-siglevel-check.sh"
      - ".github/workflows/install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version && shellcheck -s sh site/public/install.sh
      # dash is Ubuntu's sh; -n parses without running.
      - run: dash -n site/public/install.sh && sh site/public/install.sh --help

  archive:
    name: archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read
      attestations: read
    env:
      # gh is installed on the runners; a token lets it verify the attestation.
      GH_TOKEN: ${{ github.token }}
      PREFIX: /tmp/residue-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run
        run: |
          sh site/public/install.sh --dry-run --prefix "$PREFIX" | tee dry.log
          test ! -e "$PREFIX/residue"
          grep -q '^Dry run: nothing was changed' dry.log
      - name: Install from the archive, piped as in the docs
        run: |
          sh -s -- --archive --prefix "$PREFIX" --no-service < site/public/install.sh | tee install.log
          grep -q '^Checksum: matches SHA256SUMS' install.log
          grep -q "^Attestation: verified, built by whiteheap/residue-cli's release.yml at refs/tags/v" install.log
          grep -q '^Channel:    archive' install.log
          "$PREFIX/residue" --version
          "$PREFIX/residue" scan .
      - name: Again, which is a no-op
        run: |
          sh site/public/install.sh --prefix "$PREFIX" --no-service | tee again.log
          grep -q 'is already installed at' again.log
      # 0.0.5 was built before the rename, so the old name attests it.
      - name: An older release, then an upgrade back to the latest
        run: |
          sh site/public/install.sh --version v0.0.5 --prefix "$PREFIX" --no-service | tee old.log
          test "$("$PREFIX/residue" --version)" = "residue 0.0.5"
          grep -q "^Attestation: verified, built by whiteheap/residue's release.yml at refs/tags/v0.0.5" old.log
          sh site/public/install.sh --prefix "$PREFIX" --no-service
          "$PREFIX/residue" --version
      # packages.yml on main attests the FreeBSD archives, not release.yml. A
      # uname that answers FreeBSD makes the script fetch and check one; the
      # binary cannot run on Linux, so the script stops before installing it.
      - name: A FreeBSD archive's attestation
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/freebsd-uname"
          # shellcheck disable=SC2016 # $1 and $@ belong to the fake uname.
          printf '#!/bin/sh\ncase $1 in -s) echo FreeBSD ;; -m) echo amd64 ;; *) exec /usr/bin/uname "$@" ;; esac\n' > "$RUNNER_TEMP/freebsd-uname/uname"
          chmod +x "$RUNNER_TEMP/freebsd-uname/uname"
          if PATH="$RUNNER_TEMP/freebsd-uname:$PATH" sh site/public/install.sh --prefix "$RUNNER_TEMP/freebsd" --no-service > freebsd.log 2>&1; then exit 1; fi
          cat freebsd.log
          grep -q "^Attestation: verified, built by whiteheap/residue-cli's packages.yml at refs/heads/main" freebsd.log
          grep -q 'the downloaded residue does not run here' freebsd.log
          test ! -e "$RUNNER_TEMP/freebsd/residue"

  brew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run
        run: |
          sh site/public/install.sh --dry-run | tee dry.log
          grep -q '^+ brew install whiteheap/tap/residue' dry.log
          if brew list --formula whiteheap/tap/residue; then exit 1; fi
      # The default run, service step included. ~/src is a code folder for a
      # residue that needs none (0.0.7 on); an older one prints the command.
      - name: Install through Homebrew
        run: |
          mkdir -p ~/src
          sh site/public/install.sh | tee install.log
          grep -q '^Channel:    brew' install.log
          grep '^Cleanup:' install.log
          residue --version
          brew test whiteheap/tap/residue
      - name: Again, which is an upgrade
        run: |
          sh site/public/install.sh --no-service | tee again.log
          grep -q '^+ brew upgrade whiteheap/tap/residue' again.log
      - name: Remove the service
        if: always()
        run: residue service uninstall || true

  apt:
    name: apt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 26.04 checks the repository's signature with Sequoia (sqv).
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run
        run: |
          sh site/public/install.sh --dry-run | tee dry.log
          grep -q '^+ sudo env DEBIAN_FRONTEND=noninteractive apt-get -q install -y residue' dry.log
          test ! -e /etc/apt/sources.list.d/residue.list
      # The runner's user has passwordless sudo, so the script picks apt. A
      # runner has no systemd user manager until lingering is on, as in
      # .github/service-smoke.sh.
      - name: Install through apt
        run: |
          sudo loginctl enable-linger "$(id -un)"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 30); do systemctl --user show-environment > /dev/null 2>&1 && break; sleep 1; done
          mkdir -p ~/src
          sh site/public/install.sh | tee install.log
          grep -q '^Channel:    apt' install.log
          grep '^Cleanup:' install.log
          /usr/bin/residue --version
          apt-cache policy residue
      - name: Again, which is an upgrade or a no-op
        run: |
          sh site/public/install.sh --no-service | tee again.log
          grep -q '^Channel:    apt' again.log
      - name: Remove the service
        if: always()
        run: XDG_RUNTIME_DIR="/run/user/$(id -u)" residue service uninstall || true

  # dnf, pacman and busybox in containers, as root: no sudo, no systemd, so
  # --no-service. The script is mounted read-only. pacman starts from a
  # [residue] section an older install.sh wrote, with no SigLevel, and
  # .github/pacman-siglevel-check.sh witnesses what the script does to it.
  container:
    name: ${{ matrix.channel }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:latest", channel: dnf, setup: "true", check: "true" }
          - image: "archlinux:base"
            channel: pacman
            setup: "pacman-key --init && pacman-key --populate archlinux && sh /g/pacman-siglevel-check.sh seed"
            # pacman must require the database's signature, not only the packages'.
            check: "sh /g/pacman-siglevel-check.sh check /s/install.sh"
          - { image: "alpine:latest", channel: archive, setup: "apk add -q curl", check: "true" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run, install, run, install again
        env:
          IMAGE: ${{ matrix.image }}
          CHANNEL: ${{ matrix.channel }}
          SETUP: ${{ matrix.setup }}
          CHECK: ${{ matrix.check }}
        run: |
          docker run --rm -e CHANNEL -v "$PWD/site/public:/s:ro" -v "$PWD/.github:/g:ro" "$IMAGE" sh -c "
            set -eu
            $SETUP
            sh /s/install.sh --dry-run > /tmp/dry.log 2>&1 || { cat /tmp/dry.log; exit 1; }
            cat /tmp/dry.log
            sh /s/install.sh --no-service | tee /tmp/install.log
            grep -q \"^Channel:    \$CHANNEL\" /tmp/install.log
            command -v residue || export PATH=\$HOME/.local/bin:\$PATH
            residue --version
            $CHECK
            sh /s/install.sh --no-service > /tmp/again.log 2>&1 || { cat /tmp/again.log; exit 1; }
            tail -5 /tmp/again.log
          "

  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14"
          copyback: false
          prepare: pkg install -y curl
          run: |
            sh site/public/install.sh --dry-run
            sh site/public/install.sh --no-service | tee /tmp/install.log
            grep -q '^Channel:    archive' /tmp/install.log
            "$HOME/.local/bin/residue" --version
            sh site/public/install.sh | tee /tmp/again.log
            grep -q 'is already installed at' /tmp/again.log
            grep -q '^Cleanup:    not available on FreeBSD' /tmp/again.log
            # --version is exact: v0.0.4 has no FreeBSD archive, so it stops
            # with a plain message, never a curl 404 or another release.
            if sh site/public/install.sh --version v0.0.4 --no-service > /tmp/exact.log 2>&1; then exit 1; fi
            cat /tmp/exact.log
            grep -q 'residue v0.0.4 has no archive for x86_64-unknown-freebsd' /tmp/exact.log
            if grep -q 'curl: (22)' /tmp/exact.log; then exit 1; fi
            test "$("$HOME/.local/bin/residue" --version)" != "residue 0.0.4"

  # Machines the script must turn away before it changes anything: no curl,
  # a CPU with no build, Ubuntu 22.04's Git 2.34 on the apt path (before
  # anything under /etc) and on the archive path (installed, cleanup not
  # turned on, exit 1). As root in containers; the script is mounted read-only.
  refusals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No curl, then a CPU with no build
        run: |
          docker run --rm -v "$PWD/site/public:/s:ro" ubuntu:24.04 sh -c '
            set -eu
            if command -v curl; then exit 1; fi
            sh /s/install.sh --help > /dev/null
            if sh /s/install.sh > /tmp/curl.log 2>&1; then exit 1; fi
            cat /tmp/curl.log
            grep -q "^install.sh: curl is needed to download residue" /tmp/curl.log
            printf "#!/bin/sh\ncase \$1 in -m) echo armv7l ;; *) exec /usr/bin/uname \"\$@\" ;; esac\n" > /usr/local/bin/uname
            chmod +x /usr/local/bin/uname
            if sh /s/install.sh > /tmp/cpu.log 2>&1; then exit 1; fi
            cat /tmp/cpu.log
            grep -q "^install.sh: no prebuilt residue for armv7l; to build it from source:" /tmp/cpu.log
            test ! -e /etc/apt/sources.list.d/residue.list
          '
      - name: Ubuntu 22.04, apt offers Git 2.34
        run: |
          docker run --rm -v "$PWD/site/public:/s:ro" ubuntu:22.04 sh -c '
            set -eu
            apt-get -q update > /dev/null
            DEBIAN_FRONTEND=noninteractive apt-get -q install -y curl ca-certificates > /dev/null
            if sh /s/install.sh > /tmp/apt.log 2>&1; then exit 1; fi
            cat /tmp/apt.log
            grep -q "^install.sh: apt offers Git 1:2.34" /tmp/apt.log
            grep -q "sudo add-apt-repository ppa:git-core/ppa" /tmp/apt.log
            test ! -e /etc/apt/sources.list.d/residue.list
            test ! -e /etc/apt/keyrings/residue.gpg
          '
      # A user whose sudo asks for a password, on a terminal (-t): the Git
      # refusal must come before the prompt. A prompt would wait for a
      # password until timeout ends it with 124.
      - name: Ubuntu 22.04, apt offers Git 2.34, no sudo prompt first
        run: |
          docker run --rm -t -v "$PWD/site/public:/s:ro" ubuntu:22.04 sh -c '
            set -eu
            apt-get -q update > /dev/null
            DEBIAN_FRONTEND=noninteractive apt-get -q install -y curl ca-certificates sudo > /dev/null
            useradd -m -G sudo tester
            echo tester:not-typed | chpasswd
            as_tester() { setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester USER=tester "$@"; }
            if as_tester sudo -n true 2> /dev/null; then exit 1; fi
            as_tester sh -c "(exec < /dev/tty)"
            set +e
            timeout 60 setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester USER=tester sh /s/install.sh < /dev/null > /tmp/user.log 2>&1
            status=$?
            set -e
            cat /tmp/user.log
            test "$status" = 1
            grep -q "^install.sh: apt offers Git 1:2.34" /tmp/user.log
            if grep -q "sudo asks for your password" /tmp/user.log; then exit 1; fi
            test ! -e /etc/apt/sources.list.d/residue.list
          '
      - name: Ubuntu 22.04 with Git 2.34, the archive
        run: |
          docker run --rm -v "$PWD/site/public:/s:ro" ubuntu:22.04 sh -c '
            set -eu
            apt-get -q update > /dev/null
            DEBIAN_FRONTEND=noninteractive apt-get -q install -y curl ca-certificates git > /dev/null
            git --version
            set +e
            sh /s/install.sh --archive > /tmp/archive.log 2>&1
            status=$?
            set -e
            cat /tmp/archive.log
            test "$status" = 1
            "$HOME/.local/bin/residue" --version
            grep -q "^Cleanup:    NOT turned on: residue needs Git 2.36 or later, and git here is 2.34" /tmp/archive.log
          '

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Git Bash is turned away, toward WSL
        run: |
          uname -s
          if sh site/public/install.sh > win.log 2>&1; then exit 1; fi
          cat win.log
          grep -q '^install.sh: residue does not run on Windows; run this inside WSL' win.log

name: release

# A v* tag builds four CLI archives and publishes them with SHA256SUMS and a
# provenance attestation, then starts packages.yml. The Mac app releases from
# whiteheap/residue-ui, which bundles the two macOS archives of a release
# published here; 0.0.10 is the last release here with residue-macos.dmg.
#
# A pull request that changes this file, and a manual run (gh workflow run
# release.yml --ref BRANCH), are dry runs: they build and check everything for
# the version in Cargo.toml and keep the archives as the run's artifacts. They
# attest nothing, publish nothing and start nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, runs: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, runs: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TAG names the archives: the pushed tag, or for a dry run the tag this
      # version would have.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Run
        if: matrix.runs
        run: |
          ./target/${{ matrix.target }}/release/residue --version
          ./target/${{ matrix.target }}/release/residue scan .
      - name: Package
        run: |
          name="residue-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/residue" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Checksums and release notes, with read-only permissions, on every run. A
  # dry run ends here; its summary lists what a release would publish.
  checksums:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The four archives. packages.yml rewrites this file later and keeps these
      # lines.
      - name: Checksums
        run: |
          cd dist
          sha256sum residue-v*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # How to install, then the version's CHANGELOG.md section. The file
      # names are release.yml's four archives and packages.yml's packages and
      # FreeBSD archives (packaging/linux-packages.sh names the packages).
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          v="residue-v$version"
          cat > dist/notes.md <<EOF
          ### Install

          \`\`\`sh
          curl -fsSL https://residue.whiteheap.com/install.sh | sh
          brew install whiteheap/tap/residue
          \`\`\`

          Either one; every other way is in [docs/installation.md](https://github.com/whiteheap/residue-cli/blob/main/docs/installation.md). Or download the file for your machine below. The packages and the FreeBSD archives arrive within half an hour of the release.

          | Machine | File |
          | --- | --- |
          | macOS, Apple silicon | \`$v-aarch64-apple-darwin.tar.gz\` |
          | macOS, Intel | \`$v-x86_64-apple-darwin.tar.gz\` |
          | Linux, static (musl), x86_64 | \`$v-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux, static (musl), arm64 | \`$v-aarch64-unknown-linux-musl.tar.gz\` |
          | Debian, Ubuntu | \`residue_amd64.deb\`, \`residue_arm64.deb\` |
          | Fedora, RHEL | \`residue.x86_64.rpm\`, \`residue.aarch64.rpm\` |
          | Arch Linux | \`residue-x86_64.pkg.tar.zst\`, \`residue-aarch64.pkg.tar.zst\` |
          | FreeBSD, x86_64 | \`$v-x86_64-unknown-freebsd.tar.gz\` |
          | FreeBSD, aarch64 | \`$v-aarch64-unknown-freebsd.tar.gz\` |

          Check a download: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`, then \`gh attestation verify FILE --repo whiteheap/residue-cli\`.

          The Mac app: https://github.com/whiteheap/residue-ui/releases
          EOF
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/changes.md
          test -s dist/changes.md
          cat dist/changes.md >> dist/notes.md
          cat dist/notes.md
      - name: Summary
        run: |
          {
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "The publish job releases these as $GITHUB_REF_NAME:"
            else
              echo "Dry run: nothing is attested or published. A release would publish:"
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error

  # Only a tag push gets here, and only this job can write to the repository.
  publish:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check every asset against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # The subjects are exactly the files SHA256SUMS lists: the four archives.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/residue-v*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "residue $GITHUB_REF_NAME" --notes-file dist/notes.md

  # Starts packages.yml as its own run on main instead of calling it as a
  # reusable workflow: a called workflow does not receive the github-pages
  # environment's PACKAGE_SIGNING_KEY, so the repositories would not be signed.
  packages:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start packages.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

name: release

# A v* tag builds four CLI archives and the Mac app, residue-macos.dmg, whose
# residue is the two macOS archives' binaries joined into one. It publishes
# them with SHA256SUMS and a provenance attestation, then starts packages.yml.
# The DMG has the same name in every release, so
# https://github.com/whiteheap/residue-cli/releases/latest/download/residue-macos.dmg
# always serves the newest one.
#
# A pull request that changes this file or app/scripts/, and a manual run
# (gh workflow run release.yml --ref BRANCH), are dry runs: they build and
# check everything for the version in Cargo.toml and keep the archives and the
# DMG as the run's artifacts. They attest nothing, publish nothing and start
# nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, runs: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, runs: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TAG names the archives: the pushed tag, or for a dry run the tag this
      # version would have.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Run
        if: matrix.runs
        run: |
          ./target/${{ matrix.target }}/release/residue --version
          ./target/${{ matrix.target }}/release/residue scan .
      - name: Package
        run: |
          name="residue-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/residue" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Mac app, with the residue this release publishes: the binaries of the
  # two macOS archives above, joined with lipo (app/scripts/sidecar.sh
  # --from), never a second build. It runs the app build's third-party code
  # (npm packages, crate build scripts), so it holds no token that can write
  # or sign anything, and it uses no dependency cache.
  app:
    name: residue-macos.dmg
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-apple-darwin"
          path: archives
          merge-multiple: true
      - name: The release's residue, universal
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -xzf "archives/residue-$TAG-$t.tar.gz" -C archives "residue-$TAG-$t/residue"
          done
          sh app/scripts/sidecar.sh --from \
            "archives/residue-$TAG-aarch64-apple-darwin/residue" \
            "archives/residue-$TAG-x86_64-apple-darwin/residue"
      # app/rust-toolchain.toml pins the app's toolchain and both macOS targets.
      - name: Toolchain
        working-directory: app
        run: rustup toolchain install && rustc --version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      # Signing. tauri.conf.json sets signingIdentity "-", so Tauri signs the
      # bundled residue, the app and the bundle ad hoc (an unsigned arm64
      # binary does not run), and the app is not notarized: the README's
      # "Mac app" section has the first-launch steps this needs.
      # With a Developer ID, sign and notarize here: give this step
      # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY,
      # and APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_PATH (or APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID) from a protected environment that
      # only v* tags can use, so Tauri signs with the identity and notarizes.
      # This job runs third-party build code, so prefer a separate job that
      # signs, notarizes and staples the built app with codesign and notarytool.
      # Then change the "adhoc" check below and the README's first-launch steps.
      - name: Build the app (universal, ad-hoc signed)
        working-directory: app
        run: pnpm tauri build --ci --target universal-apple-darwin -- --locked
      - name: Package the DMG
        run: |
          set -- app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one DMG from the build, found: $*"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$1" "$RUNNER_TEMP/release/residue-macos.dmg"
          ls -l "$RUNNER_TEMP/release"
      # Checks what users download: the app inside the DMG, mounted read-only.
      - name: Check the app inside the DMG
        run: |
          dmg="$RUNNER_TEMP/release/residue-macos.dmg"
          mnt="$RUNNER_TEMP/dmg"
          hdiutil verify "$dmg"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          # A residue child of the launch check below can still hold the volume.
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          app="$mnt/residue.app"
          plist="$app/Contents/Info.plist"
          ls -la "$mnt"
          plutil -p "$plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = com.whiteheap.residue
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = residue
          # One version: the app's is the tag's, like the residue inside it.
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$VERSION"
          # The app's executable is residue, the name macOS shows; the CLI
          # inside it is residue-cli.
          ls -la "$app/Contents/MacOS"
          main=$(plutil -extract CFBundleExecutable raw -o - "$plist")
          test "$main" = residue
          test "$(lipo -archs "$app/Contents/MacOS/$main")" = "x86_64 arm64"
          cli="$app/Contents/MacOS/residue-cli"
          test "$(lipo -archs "$cli")" = "x86_64 arm64"
          test "$("$cli" --version)" = "residue $VERSION"
          # The bundled residue is the archives' binaries: signing rewrites
          # the signature, never the linker's UUID of each architecture.
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            dwarfdump --uuid "archives/residue-$TAG-$t/residue"
          done | awk '{ print $2, $3 }' | sort > "$RUNNER_TEMP/uuid-archives"
          dwarfdump --uuid "$cli" | awk '{ print $2, $3 }' | sort > "$RUNNER_TEMP/uuid-app"
          cat "$RUNNER_TEMP/uuid-app"
          diff "$RUNNER_TEMP/uuid-archives" "$RUNNER_TEMP/uuid-app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$cli"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qx 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          # The app starts from the volume and is still running a few seconds
          # later: a signature or library problem kills it at launch.
          "$app/Contents/MacOS/$main" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            wait "$pid" || echo "::error::The app exited at launch with status $?."
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residue-macos.dmg
          path: ${{ runner.temp }}/release/residue-macos.dmg
          if-no-files-found: error

  # Checksums and release notes, with read-only permissions, on every run. A
  # dry run ends here; its summary lists what a release would publish.
  checksums:
    needs: [build, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Every asset by name, so a missing DMG fails here. packages.yml rewrites
      # this file later and keeps these lines.
      - name: Checksums
        run: |
          cd dist
          sha256sum residue-v*.tar.gz residue-macos.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          cat >> dist/notes.md <<'EOF'

          **Mac app:** `residue-macos.dmg` is the app for macOS 13 or later, on Apple silicon and Intel, with this release's residue inside. It is not notarized yet, so macOS blocks it the first time: the [README](https://github.com/whiteheap/residue-cli#mac-app) has the steps to open it.
          EOF
          cat dist/notes.md
      - name: Summary
        run: |
          {
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "The publish job releases these as $GITHUB_REF_NAME:"
            else
              echo "Dry run: nothing is attested or published. A release would publish:"
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error

  # Only a tag push gets here, and only this job can write to the repository.
  publish:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check every asset against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # The subjects are exactly the files SHA256SUMS lists: the four archives
      # and the DMG.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/residue-v*.tar.gz dist/residue-macos.dmg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "residue $GITHUB_REF_NAME" --notes-file dist/notes.md

  # Starts packages.yml as its own run on main instead of calling it as a
  # reusable workflow: a called workflow does not receive the github-pages
  # environment's PACKAGE_SIGNING_KEY, so the repositories would not be signed.
  packages:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start packages.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

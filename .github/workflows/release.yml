name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, runs: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, runs: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Run
        if: matrix.runs
        run: |
          ./target/${{ matrix.target }}/release/residue --version
          ./target/${{ matrix.target }}/release/residue scan .
      - name: Package
        run: |
          name="residue-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/residue" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "residue $GITHUB_REF_NAME" --notes-file notes.md

  # Starts packages.yml as its own run on main instead of calling it as a
  # reusable workflow: a called workflow does not receive the github-pages
  # environment's PACKAGE_SIGNING_KEY, so the repositories would not be signed.
  packages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start packages.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 and 26.04, the two supported LTS releases, x86_64 and
        # arm64. 26.04 brings sudo-rs, Rust coreutils and a newer systemd.
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: In-crate tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      # A real, read-only run on this checkout: one linked worktree, scanned
      # and explained. Nothing is removed.
      - name: Scan this checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/ci-worktree" HEAD
          ./target/release/residue --version
          ./target/release/residue scan .
          ./target/release/residue explain "$RUNNER_TEMP/ci-worktree"
          ./target/release/residue scan . --json | jq -e '.schema == "residue.scan/v1" and .summary.linked_worktrees == 1'
      - name: Smoke test
        run: sh .github/smoke.sh ./target/release/residue
      - name: Watch smoke test
        run: sh .github/watch-smoke.sh ./target/release/residue
      - name: Service smoke test
        if: ${{ !endsWith(matrix.os, '-arm') }}
        run: sh .github/service-smoke.sh ./target/release/residue
      # The race check: change a worktree while the release binary waits at
      # its prompt, answer yes, and check that residue removes nothing.
      - name: Race check
        run: bash scripts/race-check.sh target/release/residue
      - name: Contract check
        run: bash scripts/contract-check.sh target/release/residue
      - name: Recovery check
        run: bash scripts/recovery-check.sh target/release/residue
      # Its mount cases need root: a tmpfs, and a folder of the worktree's
      # own filesystem bind-mounted inside it, before the plan and after the
      # move aside (2c, 2e, 2e2). The runner's user may sudo.
      - name: Recovery check as root
        if: runner.os == 'Linux'
        run: sudo bash scripts/recovery-check.sh target/release/residue
      # The same with statx(2) refused for residue and what it runs
      # (.github/nostatx.c), as on Linux before 4.11 or under a seccomp
      # filter: the walk reads /proc/self/mountinfo for mount points
      # instead, and the mount cases must still keep the worktree.
      - name: Recovery check as root, without statx
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cc -O2 -Wall -Werror -o "$RUNNER_TEMP/nostatx" .github/nostatx.c
          printf '#!/bin/sh\nexec "%s" ENOSYS "%s" "$@"\n' "$RUNNER_TEMP/nostatx" "$PWD/target/release/residue" >"$RUNNER_TEMP/residue-nostatx"
          chmod +x "$RUNNER_TEMP/residue-nostatx"
          sudo bash scripts/recovery-check.sh "$RUNNER_TEMP/residue-nostatx"
      # residue in a PID namespace of its own, as a container has, with a
      # sleep outside in the worktree: activity unknown, never not_observed.
      # It needs root to make the namespace.
      - name: Contained check
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" bash scripts/contained-check.sh target/release/residue

  # FreeBSD runs in a virtual machine. residue's probe there is the base
  # system's ps and two kernel sysctls, so nothing beyond Rust and Git is
  # installed, plus bash for the race check. The smoke tests and the race
  # check run as root and as an ordinary user, who can inspect only their own
  # processes. The user exists before the root run, whose contract check
  # turns security.bsd.unprivileged_proc_debug off for that user and back
  # on. The log shows which filesystem the scratch folders are on.
  freebsd:
    name: freebsd-14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14"
          copyback: false
          prepare: pkg install -y rust git bash jq
          run: |
            freebsd-version
            rustc --version
            mount -p
            df -T /tmp "$PWD"
            sysctl security.bsd.unprivileged_proc_debug
            cargo build --locked --release
            pw useradd smoke -m
            sh .github/smoke.sh ./target/release/residue
            sh .github/watch-smoke.sh ./target/release/residue
            bash scripts/race-check.sh ./target/release/residue
            bash scripts/contract-check.sh ./target/release/residue
            bash scripts/recovery-check.sh ./target/release/residue
            bash scripts/contained-check.sh ./target/release/residue
            su smoke -c "sh $PWD/.github/smoke.sh $PWD/target/release/residue"
            su smoke -c "sh $PWD/.github/watch-smoke.sh $PWD/target/release/residue"
            su smoke -c "bash $PWD/scripts/race-check.sh $PWD/target/release/residue"
            su smoke -c "bash $PWD/scripts/contract-check.sh $PWD/target/release/residue"
            su smoke -c "bash $PWD/scripts/recovery-check.sh $PWD/target/release/residue"

  # NetBSD, OpenBSD and DragonFly run in virtual machines too. Their probe is
  # the base system's ps plus one sysctl per process (kern.proc_cwd and its
  # NetBSD and DragonFly forms), so only Rust, Git, bash and jq are
  # installed. Each runs the build, both smoke tests, the race check, the
  # contract check and the recovery check as root and as an ordinary user.
  # As an ordinary user OpenBSD names only that user's working directories;
  # NetBSD and DragonFly name every process's by default.
  netbsd:
    name: netbsd-10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1.5.3
        with:
          release: "10"
          copyback: false
          prepare: /usr/sbin/pkg_add rust git-base bash jq
          run: |
            # /tmp is tmpfs, which reports itself 100% free, so the watch
            # smoke test's disk-pressure case needs a disk-backed TMPDIR.
            export TMPDIR=/var/tmp
            uname -a
            rustc --version
            cargo build --locked --release
            sh .github/smoke.sh ./target/release/residue
            sh .github/watch-smoke.sh ./target/release/residue
            PATH="$PWD/.github/script-adapter:$PATH" bash scripts/race-check.sh ./target/release/residue
            bash scripts/contract-check.sh ./target/release/residue
            bash scripts/recovery-check.sh ./target/release/residue
            useradd -m -s /bin/sh smoke
            su smoke -c "TMPDIR=/var/tmp sh $PWD/.github/smoke.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp sh $PWD/.github/watch-smoke.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp PATH=$PWD/.github/script-adapter:\$PATH bash $PWD/scripts/race-check.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp bash $PWD/scripts/contract-check.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp bash $PWD/scripts/recovery-check.sh $PWD/target/release/residue"

  openbsd:
    name: openbsd-7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "7.8"
          copyback: false
          prepare: pkg_add rust git bash jq
          run: |
            uname -a
            rustc --version
            cargo build --locked --release
            sh .github/smoke.sh ./target/release/residue
            sh .github/watch-smoke.sh ./target/release/residue
            PATH="$PWD/.github/script-adapter:$PATH" bash scripts/race-check.sh ./target/release/residue
            bash scripts/contract-check.sh ./target/release/residue
            bash scripts/recovery-check.sh ./target/release/residue
            useradd -m -s /bin/sh smoke
            su smoke -c "sh $PWD/.github/smoke.sh $PWD/target/release/residue"
            su smoke -c "sh $PWD/.github/watch-smoke.sh $PWD/target/release/residue"
            su smoke -c "PATH=$PWD/.github/script-adapter:\$PATH bash $PWD/scripts/race-check.sh $PWD/target/release/residue"
            su smoke -c "bash $PWD/scripts/contract-check.sh $PWD/target/release/residue"
            su smoke -c "bash $PWD/scripts/recovery-check.sh $PWD/target/release/residue"

  dragonfly:
    name: dragonfly-6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41 # v1.3.4
        with:
          release: "6.4"
          copyback: false
          prepare: pkg install -y rust git bash jq
          run: |
            # /tmp is tmpfs, which reports itself 100% free, so the watch
            # smoke test's disk-pressure case needs a disk-backed TMPDIR.
            export TMPDIR=/var/tmp
            uname -a
            rustc --version
            cargo build --locked --release
            sh .github/smoke.sh ./target/release/residue
            sh .github/watch-smoke.sh ./target/release/residue
            bash scripts/race-check.sh ./target/release/residue
            bash scripts/contract-check.sh ./target/release/residue
            bash scripts/recovery-check.sh ./target/release/residue
            pw useradd smoke -m
            su smoke -c "TMPDIR=/var/tmp sh $PWD/.github/smoke.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp sh $PWD/.github/watch-smoke.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp bash $PWD/scripts/race-check.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp bash $PWD/scripts/contract-check.sh $PWD/target/release/residue"
            su smoke -c "TMPDIR=/var/tmp bash $PWD/scripts/recovery-check.sh $PWD/target/release/residue"

  # illumos (OmniOS) reads /proc/<pid>/path. It runs the build, the smoke
  # test, the contract check and the recovery check as root and as an
  # ordinary user. Root's contract check runs in /tmp, a tmpfs, and the
  # user's in their home, on ZFS: the two update the path the kernel keeps
  # for an open file differently. `df -n` shows each filesystem in the
  # log. Not the
  # watch smoke test: illumos has no inotify or kqueue, so a running watch
  # wakes on its five-minute timer, past that test's two-minute limit. Not
  # the race check: illumos script(1) cannot run a command, and the base
  # system has no other way to give residue a terminal.
  illumos:
    name: omnios-r151054
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/omnios-vm@aeee92416495d9685b2997d954f6b063ae5b832d # v1.3.8
        with:
          release: "r151054-build"
          copyback: false
          prepare: |
            pkg install developer/versioning/git || [ $? -eq 4 ]
            pkg install jq || pkg install ooce/text/jq || [ $? -eq 4 ]
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            uname -a
            rustc --version
            cargo build --locked --release
            sh .github/smoke.sh ./target/release/residue
            df -n /tmp
            bash scripts/contract-check.sh ./target/release/residue
            bash scripts/recovery-check.sh ./target/release/residue
            useradd -m -d /export/home/smoke -s /bin/sh smoke
            df -n /export/home/smoke
            su smoke -c "HOME=/export/home/smoke sh $PWD/.github/smoke.sh $PWD/target/release/residue"
            su smoke -c "HOME=/export/home/smoke TMPDIR=/export/home/smoke bash $PWD/scripts/contract-check.sh $PWD/target/release/residue"
            su smoke -c "HOME=/export/home/smoke bash $PWD/scripts/recovery-check.sh $PWD/target/release/residue"

name: app

# The Mac app in app/: type-check, lint, format, clippy and a universal build,
# with the residue CLI built from the same commit (app/scripts/sidecar.sh).
# It runs when the app, this file, or anything the bundled CLI is built from
# changes. It is not a required check, and its job name differs from the
# required ones (ci.yml's macos-latest, ubuntu-24.04 and ubuntu-24.04-arm).
# release.yml builds the DMG a release publishes; this workflow publishes
# nothing.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app-macos-universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # app/rust-toolchain.toml pins the version, clippy, rustfmt and both
      # macOS targets. scripts/sidecar.sh builds the CLI from app/, so the CLI
      # uses that toolchain too.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # residue from this commit, for both architectures, joined with lipo
      # where Tauri's externalBin expects it. tauri-build needs it for clippy.
      - name: Build the bundled residue
        run: sh scripts/sidecar.sh
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build the web assets
        run: pnpm build
      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app (universal, ad-hoc signed)
        run: pnpm tauri build --ci --target universal-apple-darwin -- --locked
      - name: Check the bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../Cargo.toml | head -1)
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/residue.app"
          plist="$app/Contents/Info.plist"
          plutil -p "$plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = com.whiteheap.residue
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = residue
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$version"
          main=$(plutil -extract CFBundleExecutable raw -o - "$plist")
          test "$(lipo -archs "$app/Contents/MacOS/$main")" = "x86_64 arm64"
          test "$(lipo -archs "$app/Contents/MacOS/residue")" = "x86_64 arm64"
          test "$("$app/Contents/MacOS/residue" --version)" = "residue $version"
          codesign --verify --deep --strict --verbose=2 "$app"
          set -- "$bundle"/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one DMG from the build, found: $*"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app"
          cp "$1" "$RUNNER_TEMP/app/residue-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residue-macos-dmg
          path: ${{ runner.temp }}/app/residue-macos.dmg
          if-no-files-found: error

name: packages

# Builds .deb, .rpm and Arch packages from a published release's static Linux
# archives, attests them, and adds them and an updated SHA256SUMS to that
# release. When the tag is the latest release, it also publishes signed apt,
# dnf and pacman repositories to https://whiteheap.github.io/residue/ with
# GitHub Pages.
# It also builds the FreeBSD x86_64 binary, in a FreeBSD virtual machine from
# the tag's source, for releases that have the FreeBSD activity probe.
# release.yml starts it after publishing. To package an existing release by
# hand: gh workflow run packages.yml -f tag=vX.Y.Z
# To check a change to this workflow without uploading or deploying anything:
# gh workflow run packages.yml --ref BRANCH -f tag=vX.Y.Z -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.1
        type: string
        required: true
      dry_run:
        description: Build and check everything, but upload and deploy nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The runners have no FreeBSD cross toolchain, so the binary is built in a
  # FreeBSD VM. A release without the FreeBSD activity probe gets no binary:
  # every worktree would be `unknown` there, so it could never remove one.
  freebsd:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Does this release have the FreeBSD probe
        id: probe
        run: |
          if grep -q 'target_os = "freebsd"' src/activity.rs; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$TAG has no FreeBSD activity probe, so no FreeBSD binary"
          fi
      - if: steps.probe.outputs.build == 'true'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14"
          envs: TAG
          prepare: pkg install -y rust git
          run: |
            freebsd-version
            cargo build --locked --release --target-dir /tmp/target
            bin=/tmp/target/release/residue
            test "$($bin --version)" = "residue ${TAG#v}"
            if [ -f .github/smoke.sh ]; then sh .github/smoke.sh "$bin"; fi
            name="residue-$TAG-x86_64-unknown-freebsd"
            mkdir -p "dist/$name"
            cp "$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
      - if: steps.probe.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd
          path: dist/*.tar.gz
          if-no-files-found: error

  # Runs even when the FreeBSD build failed, so the Linux packages and the
  # repositories never wait on it.
  linux:
    needs: freebsd
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this the latest release
        id: latest
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          echo "latest release is $latest"
          if [ "$latest" = "$TAG" ]; then echo latest=true; else echo latest=false; fi >> "$GITHUB_OUTPUT"
      - name: nfpm
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
          nfpm --version
      - name: Download the Linux archives
        run: |
          gh release download "$TAG" --dir dist --pattern '*-unknown-linux-musl.tar.gz' --pattern SHA256SUMS
          cd dist && grep -E 'unknown-linux-musl\.tar\.gz$' SHA256SUMS | sha256sum -c
      - name: Build packages
        run: packaging/linux-packages.sh "$TAG" dist pkgs
      - name: The FreeBSD binary, when one was built
        if: needs.freebsd.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: freebsd
          path: pkgs
      - if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkgs/*
      - name: Checksums
        run: |
          # Every archive already listed (release.yml's four, and a FreeBSD one
          # from an earlier run), except those this run rebuilt, then
          # everything this run built. A re-run replaces lines, never doubles.
          (cd pkgs && ls) > "$RUNNER_TEMP/built"
          {
            grep -E '\.tar\.gz$' dist/SHA256SUMS | awk 'NR == FNR { built[$0]; next } !($2 in built)' "$RUNNER_TEMP/built" -
            (cd pkgs && sha256sum -- *)
          } > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        if: ${{ !inputs.dry_run }}
        run: gh release upload "$TAG" pkgs/* SHA256SUMS --clobber

  # The package repositories hold only the latest release, so packaging an
  # older tag never rolls them back. The signing key is a secret of the
  # github-pages environment, which only this job can read.
  repositories:
    needs: linux
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.linux.outputs.latest == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      KEYRING: packaging/signing-key.asc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm
      - name: Download the packages
        run: |
          gh release download "$TAG" --dir pkgs --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst' --pattern SHA256SUMS
          cd pkgs && grep -E '\.(deb|rpm|pkg\.tar\.zst)$' SHA256SUMS | sha256sum -c
      - name: Build and sign the apt, dnf and pacman repositories
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          fpr=$(gpg --show-keys --with-colons "$KEYRING" | awk -F: '/^fpr/ { print $10; exit }')
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          packaging/apt-repo.sh pkgs site/apt "$fpr"
          packaging/rpm-repo.sh pkgs site/rpm "$fpr"
          # repo-add only exists on Arch.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e PACKAGE_SIGNING_KEY \
            -v "$PWD:/w" -w /w archlinux:base bash -c '
              export GNUPGHOME=$(mktemp -d)
              printf "%s\n" "$PACKAGE_SIGNING_KEY" | gpg --batch --quiet --import
              packaging/arch-repo.sh pkgs site/arch "$0"' "$fpr"
          rm -rf "$GNUPGHOME"
          cp "$KEYRING" site/residue-signing-key.asc
          gpg --dearmor < "$KEYRING" > site/apt/residue-archive-keyring.gpg
          cp packaging/rpm/residue.repo site/rpm/residue.repo
      - name: Check every signature against the committed public key
        run: |
          keyring=site/apt/residue-archive-keyring.gpg
          gpgv --keyring "$keyring" site/apt/dists/stable/InRelease
          gpgv --keyring "$keyring" site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          for sig in site/arch/*/*.sig site/rpm/*/repodata/repomd.xml.asc; do
            gpgv --keyring "$keyring" "$sig" "${sig%.*}"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

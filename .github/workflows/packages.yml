name: packages

# Builds .deb, .rpm and Arch packages from a published release's static Linux
# archives, attests them, and adds them and an updated SHA256SUMS to that
# release. When the tag is the latest release, it also rebuilds the signed
# apt, dnf and pacman repositories from those packages and publishes them at
# https://whiteheap.github.io/residue/, by pushing them to residue/ in
# whiteheap/whiteheap.github.io, the organization's GitHub Pages site.
# It also builds the FreeBSD x86_64 and aarch64 binaries, each in a FreeBSD
# virtual machine of its architecture from the tag's source, for releases
# that have the FreeBSD activity probe.
# release.yml starts it after publishing. To package an existing release by
# hand: gh workflow run packages.yml -f tag=vX.Y.Z
# To publish the repositories again from the packages already in the latest
# release, building and uploading nothing:
# gh workflow run packages.yml -f tag=vX.Y.Z -f republish=true
# To check a change to this workflow without uploading or deploying anything:
# gh workflow run packages.yml --ref BRANCH -f tag=vX.Y.Z -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.1
        type: string
        required: true
      dry_run:
        description: Build and check everything, but upload and deploy nothing
        type: boolean
        default: false
      republish:
        description: Build nothing; publish the repositories again from the release's packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The runners have no FreeBSD cross toolchain, so each binary is built in a
  # FreeBSD VM of its own architecture. The aarch64 VM is emulated on an
  # x86_64 runner, as vmactions/freebsd-vm recommends, so that leg is slower:
  # 13.5 minutes against 2 for x86_64 in the v0.0.5 dry run (run 42369712711).
  # The linux job waits for both, so the timeout bounds how long a hung VM
  # can hold back the Linux packages.
  # Each leg builds, runs and smoke-tests its binary on its own architecture;
  # one failing never drops the other's archive. A release without the
  # FreeBSD activity probe gets no binary: every worktree would be `unknown`
  # there, so it could never remove one. A republish builds nothing.
  freebsd:
    name: freebsd-${{ matrix.arch }}
    if: ${{ !inputs.republish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Does this release have the FreeBSD probe
        id: probe
        run: |
          if grep -q 'target_os = "freebsd"' src/activity.rs; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$TAG has no FreeBSD activity probe, so no FreeBSD binary"
          fi
      - if: steps.probe.outputs.build == 'true'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14"
          arch: ${{ matrix.arch }}
          envs: TAG ARCH
          prepare: pkg install -y rust git
          run: |
            freebsd-version
            uname -mp
            rustc -vV
            # The archive is named for the triple this VM builds and runs.
            rustc -vV | grep -qx "host: $ARCH-unknown-freebsd"
            cargo build --locked --release --target-dir /tmp/target
            bin=/tmp/target/release/residue
            file "$bin"
            test "$($bin --version)" = "residue ${TAG#v}"
            if [ -f .github/smoke.sh ]; then sh .github/smoke.sh "$bin"; fi
            name="residue-$TAG-$ARCH-unknown-freebsd"
            mkdir -p "dist/$name"
            cp "$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
      - if: steps.probe.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Runs even when a FreeBSD build failed, so the Linux packages and the
  # repositories never wait on a broken one; it takes the archives of the
  # legs that succeeded. A republish skips it, and uploads nothing.
  linux:
    needs: freebsd
    if: ${{ !cancelled() && !inputs.republish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nfpm
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
          nfpm --version
      - name: Download the Linux archives
        run: |
          gh release download "$TAG" --dir dist --pattern '*-unknown-linux-musl.tar.gz' --pattern SHA256SUMS
          cd dist && grep -E 'unknown-linux-musl\.tar\.gz$' SHA256SUMS | sha256sum -c
      - name: Build packages
        run: packaging/linux-packages.sh "$TAG" dist pkgs
      - name: The FreeBSD binaries that were built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: freebsd-*
          merge-multiple: true
          path: pkgs
      - if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkgs/*
      - name: Checksums
        run: |
          # Every archive already listed (release.yml's four, and a FreeBSD one
          # from an earlier run) and the Mac app (release.yml's
          # residue-macos.dmg), except those this run rebuilt, then
          # everything this run built. A re-run replaces lines, never doubles.
          (cd pkgs && ls) > "$RUNNER_TEMP/built"
          {
            grep -E '\.(tar\.gz|dmg)$' dist/SHA256SUMS | awk 'NR == FNR { built[$0]; next } !($2 in built)' "$RUNNER_TEMP/built" -
            (cd pkgs && sha256sum -- *)
          } > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        if: ${{ !inputs.dry_run }}
        run: gh release upload "$TAG" pkgs/* SHA256SUMS --clobber

  # The package repositories hold only the latest release, so packaging an
  # older tag never rolls them back. It runs after the linux job, or at once
  # in a republish. The repositories job checks again right before it pushes.
  latest:
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    env:
      TAG: ${{ inputs.tag }}
      REPUBLISH: ${{ inputs.republish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Is this the latest release
        id: latest
        run: |
          # Fails when TAG has no release.
          gh release view "$TAG" --json tagName --jq .tagName
          latest=$(gh release view --json tagName --jq .tagName)
          echo "latest release is $latest"
          if [ "$latest" = "$TAG" ]; then echo latest=true; else echo latest=false; fi >> "$GITHUB_OUTPUT"
          if [ "$REPUBLISH" = true ] && [ "$latest" != "$TAG" ]; then
            echo "::error::A republish publishes only the latest release, $latest, never an older one"
            exit 1
          fi

  # Rebuilds the repositories from the release's packages, the ones the linux
  # job just uploaded or, in a republish, the ones already there, and pushes
  # them to whiteheap/whiteheap.github.io. That repository's GitHub Pages site
  # serves them at https://whiteheap.github.io/residue/, an address that does
  # not change with this repository's name. Both secrets, the signing key and
  # the deploy key that can push there, belong to the github-pages
  # environment, which only main and v* tags can use, so only this job can
  # read them. One run publishes at a time; the push's lease and the second
  # latest-release check keep a late run from replacing a newer release.
  repositories:
    needs: [latest, linux]
    if: >-
      ${{ !cancelled() && !inputs.dry_run && needs.latest.outputs.latest == 'true' &&
      (needs.linux.result == 'success' || (inputs.republish && needs.linux.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: package-repositories
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://whiteheap.github.io/residue/
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      KEYRING: packaging/signing-key.asc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm
      - name: Download the packages
        run: |
          gh release download "$TAG" --dir pkgs --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst' --pattern SHA256SUMS
          cd pkgs
          # Every package downloaded is listed in SHA256SUMS, and matches it.
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort > "$RUNNER_TEMP/downloaded"
          grep -E '\.(deb|rpm|pkg\.tar\.zst)$' SHA256SUMS | awk '{ print $2 }' | LC_ALL=C sort > "$RUNNER_TEMP/listed"
          diff "$RUNNER_TEMP/listed" "$RUNNER_TEMP/downloaded" ||
            { echo "::error::The packages downloaded (>) and those SHA256SUMS lists (<) differ"; exit 1; }
          grep -E '\.(deb|rpm|pkg\.tar\.zst)$' SHA256SUMS | sha256sum -c
      - name: Build and sign the apt, dnf and pacman repositories
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          fpr=$(gpg --show-keys --with-colons "$KEYRING" | awk -F: '/^fpr/ { print $10; exit }')
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          packaging/apt-repo.sh pkgs repositories/apt "$fpr"
          packaging/rpm-repo.sh pkgs repositories/rpm "$fpr"
          # repo-add only exists on Arch.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e PACKAGE_SIGNING_KEY \
            -v "$PWD:/w" -w /w archlinux:base bash -c '
              export GNUPGHOME=$(mktemp -d)
              printf "%s\n" "$PACKAGE_SIGNING_KEY" | gpg --batch --quiet --import
              packaging/arch-repo.sh pkgs repositories/arch "$0"' "$fpr"
          rm -rf "$GNUPGHOME"
          cp "$KEYRING" repositories/residue-signing-key.asc
          gpg --dearmor < "$KEYRING" > repositories/apt/residue-archive-keyring.gpg
          cp packaging/rpm/residue.repo repositories/rpm/residue.repo
      - name: Check every signature against the committed public key
        run: |
          keyring=repositories/apt/residue-archive-keyring.gpg
          gpgv --keyring "$keyring" repositories/apt/dists/stable/InRelease
          gpgv --keyring "$keyring" repositories/apt/dists/stable/Release.gpg repositories/apt/dists/stable/Release
          for sig in repositories/arch/*/*.sig repositories/rpm/*/repodata/repomd.xml.asc; do
            gpgv --keyring "$keyring" "$sig" "${sig%.*}"
          done
      # The deploy key is a write key for whiteheap/whiteheap.github.io only.
      # packaging/github-known-hosts pins GitHub's host keys.
      - name: Push to whiteheap/whiteheap.github.io
        id: push
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$latest is the latest release now, so $TAG does not replace the repositories"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "::error::The github-pages environment has no PAGES_DEPLOY_KEY secret"
            exit 1
          fi
          key="$RUNNER_TEMP/pages-deploy-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $key -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o UserKnownHostsFile=$PWD/packaging/github-known-hosts"
          message=$(printf '%s\n\n%s' "Publish residue $TAG's apt, dnf and pacman repositories" \
            "From $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          packaging/publish-repositories.sh repositories git@github.com:whiteheap/whiteheap.github.io.git main residue "$message"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # On a test site on 2026-11-08, a Pages build from a push served the new
      # file 16 and 24 seconds after the push, and its deploy replaced the
      # copy the CDN had cached, which otherwise lives 600 seconds. Fifteen
      # minutes covers a queued build and that cache.
      - name: Wait until https://whiteheap.github.io/residue/ serves them
        if: steps.push.outputs.pushed == 'true'
        timeout-minutes: 20
        run: packaging/wait-for-repositories.sh repositories https://whiteheap.github.io/residue 900

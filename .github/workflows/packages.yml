name: packages

# Builds .deb, .rpm and Arch packages from a published release's static Linux
# archives, attests them, and adds them and an updated SHA256SUMS to that
# release. When the tag is the latest release, it also publishes the signed apt
# repository at https://whiteheap.github.io/residue/apt with GitHub Pages.
# release.yml calls it after publishing. To package a release that predates
# this workflow: gh workflow run packages.yml -f tag=vX.Y.Z

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.1
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this the latest release
        id: latest
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          echo "latest release is $latest"
          if [ "$latest" = "$TAG" ]; then echo latest=true; else echo latest=false; fi >> "$GITHUB_OUTPUT"
      - name: nfpm
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
          nfpm --version
      - name: Download the Linux archives
        run: |
          gh release download "$TAG" --dir dist --pattern '*-unknown-linux-musl.tar.gz' --pattern SHA256SUMS
          cd dist && grep -E 'unknown-linux-musl\.tar\.gz$' SHA256SUMS | sha256sum -c
      - name: Build packages
        run: packaging/linux-packages.sh "$TAG" dist pkgs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkgs/*
      - name: Checksums
        run: |
          { grep -E '\.tar\.gz$' dist/SHA256SUMS; (cd pkgs && sha256sum -- *); } > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        run: gh release upload "$TAG" pkgs/* SHA256SUMS --clobber

  # The apt repository holds only the latest release, so packaging an older
  # tag never rolls it back. The signing key is a secret of the github-pages
  # environment, which only this job can read.
  apt:
    needs: linux
    if: needs.linux.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apt-ftparchive
        run: command -v apt-ftparchive || { sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils; }
      - name: Download the .deb packages
        run: |
          gh release download "$TAG" --dir debs --pattern '*.deb' --pattern SHA256SUMS
          cd debs && grep -E '\.deb$' SHA256SUMS | sha256sum -c
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          keyring=packaging/apt/residue-archive-keyring.asc
          fpr=$(gpg --show-keys --with-colons "$keyring" | awk -F: '/^fpr/ { print $10; exit }')
          packaging/apt-repo.sh debs site/apt "$fpr"
          gpg --dearmor < "$keyring" > site/apt/residue-archive-keyring.gpg
          gpgv --keyring site/apt/residue-archive-keyring.gpg site/apt/dists/stable/InRelease
          gpgv --keyring site/apt/residue-archive-keyring.gpg site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

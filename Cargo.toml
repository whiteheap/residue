[package]
name = "residue"
version = "0.0.12"
edition = "2024"
rust-version = "1.85"
description = "Reclaim your storage from Git worktrees, automatically and safely. residue removes a worktree only when nothing in it would be lost, whichever coding agent left it."
license = "MIT"
repository = "https://github.com/whiteheap/residue-cli"
homepage = "https://residue.whiteheap.com"
readme = "README.md"
keywords = ["git", "worktree", "disk", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md"]

[dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
